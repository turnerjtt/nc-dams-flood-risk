<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>North Carolina Dams &amp; Flood Risk</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.0/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.14.0/css/all.css">
    <link href="https://fonts.googleapis.com/css?family=Titillium+Web:400,700" rel="stylesheet">
    <style>
        html, body, #map { width: 100%; height: 100%; margin: 0; background: #fff; }

        /* title panel (top left) */
        .map-title {
            font-family: 'Titillium Web', sans-serif;
            background: rgba(255,255,255,0.9);
            padding: 8px 12px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            max-width: 300px;
            color: #333333;
        }
        .map-title h1 { font-size: 20px; margin: 0; line-height: 24px; }
        .map-title p  { font-size: 13px; margin: 4px 0 0 0; line-height: 17px; }

        /* legend (top right) */
        .legend {
            font-family: 'Titillium Web', sans-serif;
            line-height: 24px;
            font-size: 16px;
            width: 200px;
            color: #333333;
            padding: 6px 8px;
            background: white;
            background: rgba(255,255,255,0.9);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            border-radius: 5px;
        }
        .legend i {
            width: 20px;
            height: 20px;
            float: left;
            margin-right: 8px;
            opacity: 0.9;
            text-align: center;
            clear: left;
        }
        .legend i.fas { font-size: 14px; line-height: 20px; }

        /* dam markers: remove Leaflet's default white box and center the glyph on the point */
        .dam-icon { background: none; border: none; }
        .dam-icon i { display: block; width: 100%; height: 100%; text-align: center; }
        .legend p {
            font-size: 14px;
            line-height: 20px;
            margin: 0;
        }

        /* popups */
        .leaflet-popup-content { font-family: 'Titillium Web', sans-serif; font-size: 14px; }
        .leaflet-popup-content b.title { font-size: 16px; }
    </style>
    <script src="https://unpkg.com/leaflet@1.7.0/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/1.3.4/chroma.min.js"></script>
</head>
<body>
<!-- Our web map and content will go here -->
<div id="map"></div>
<script>

    // 1. Create a map object.
    var mymap = L.map('map', {
        center: [35.4, -79.6], // centered on North Carolina
        zoom: 7,
        maxZoom: 16,
        minZoom: 6,
        detectRetina: true
    });

    // zoom so the whole state fits the screen
    mymap.fitBounds([[33.8, -84.3], [36.6, -75.5]]);

    // 2. Add a base map (Esri Light Gray Canvas - free, no API key needed).
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Basemap &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors',
        maxZoom: 16
    }).addTo(mymap);

    // 3. Colors for the dam markers, by hazard potential classification.
    // High = a failure would probably cause loss of life
    // Significant = a failure would cause economic / environmental damage
    // Low = a failure would cause little damage
    var damColors = ['#d7301f', '#fc8d59', '#7a7a7a'];
    // High-hazard dams are the focus, so they are biggest and drawn on top;
    // Low-hazard dams are smaller and faded so they don't crowd the map.
    var damSizes   = [12, 10, 8];
    var damOpacity = [1, 0.9, 0.6];
    var damZ       = [1000, 500, 0];

    // 4. Dynamically append style classes for the dam markers.
    for (var i = 0; i < 3; i++) {
        $('head').append($("<style> .marker-color-" + (i + 1).toString() + " { color: " + damColors[i] + "; font-size: " + damSizes[i] + "px; line-height: " + damSizes[i] + "px; opacity: " + damOpacity[i] + "; text-shadow: 0 0 2px #ffffff;} </style>"));
    }

    // 5. Set color ramp for the choropleth (5 classes of blues).
    var colors = chroma.scale('Blues').colors(5);

    // FEMA's inland flood risk score is a national percentile from 0-100,
    // so equal intervals of 20 make each class easy to read.
    function setColor(score) {
        var id = 0;
        if (score > 80) { id = 4; }
        else if (score > 60 && score <= 80) { id = 3; }
        else if (score > 40 && score <= 60) { id = 2; }
        else if (score > 20 && score <= 40) { id = 1; }
        else { id = 0; }
        return colors[id];
    }

    // 6. Style function for the counties.
    function style(feature) {
        return {
            fillColor: setColor(feature.properties.flood_score),
            fillOpacity: 0.6,
            weight: 1,
            opacity: 1,
            color: '#ffffff'
        };
    }

    // 7. Add county polygons (added first so the dams draw on top).
    var counties = L.geoJson.ajax("assets/nc_county_flood_risk.geojson", {
        style: style,
        onEachFeature: function (feature, layer) {
            var p = feature.properties;
            layer.bindPopup(
                '<b class="title">' + p.county + ' County</b><br>' +
                'Flood risk score: <b>' + p.flood_score + '</b> / 100<br>' +
                'FEMA rating: ' + p.flood_rating + '<br>' +
                'Dams: ' + p.dam_count + ' (' + p.high_hazard_dams + ' high hazard)'
            );
            // highlight a county when the mouse is over it
            layer.on({
                mouseover: function (e) { e.target.setStyle({ weight: 3, color: '#333333' }); },
                mouseout:  function (e) { counties.resetStyle(e.target); }
            });
        },
        attribution: 'Flood Risk &copy; FEMA National Risk Index | Dams &copy; USACE National Inventory of Dams | Map by Joshua Turner'
    }).addTo(mymap);

    // 8. Add the dams. Each hazard class goes in its own group so it can be
    // switched on and off from the layer control.
    var damGroups = {
        High: L.layerGroup().addTo(mymap),
        Significant: L.layerGroup().addTo(mymap),
        Low: L.layerGroup().addTo(mymap)
    };

    var dams = L.geoJson.ajax("assets/nc_dams.geojson", {

        // popup for each dam, and put it in its hazard group
        onEachFeature: function (feature, layer) {
            var p = feature.properties;
            (damGroups[p.hazard] || damGroups.Low).addLayer(layer);
            layer.bindPopup(
                '<b class="title">' + p.name + '</b><br>' +
                (p.river ? 'River/stream: ' + p.river + '<br>' : '') +
                'County: ' + p.county + '<br>' +
                'Hazard potential: <b>' + p.hazard + '</b><br>' +
                'Condition: ' + (p.condition || 'Not rated') + '<br>' +
                'Year completed: ' + (p.year || 'Unknown') + '<br>' +
                'Height: ' + (p.height_ft ? p.height_ft + ' ft' : 'Unknown') + '<br>' +
                'Purpose: ' + (p.purpose || 'Unknown')
            );
        },

        // color each dam icon by hazard class
        pointToLayer: function (feature, latlng) {
            var id = 0;
            if (feature.properties.hazard == "High") { id = 0; }
            else if (feature.properties.hazard == "Significant") { id = 1; }
            else { id = 2; } // Low
            var s = damSizes[id] + 2; // a little padding around the glyph
            return L.marker(latlng, {
                icon: L.divIcon({
                    className: 'dam-icon',
                    html: '<i class="fas fa-water marker-color-' + (id + 1).toString() + '"></i>',
                    iconSize: [s, s],
                    iconAnchor: [s / 2, s / 2] // center the icon on the dam's location
                }),
                zIndexOffset: damZ[id]
            });
        }
    }); // not added to the map directly; the hazard groups above are

    // layer control to toggle each hazard class
    L.control.layers(null, {
        '<i class="fas fa-water marker-color-1"></i> High hazard dams': damGroups.High,
        '<i class="fas fa-water marker-color-2"></i> Significant hazard dams': damGroups.Significant,
        '<i class="fas fa-water marker-color-3"></i> Low hazard dams': damGroups.Low
    }, {position: 'bottomright', collapsed: false}).addTo(mymap);

    // 9. Title panel.
    var title = L.control({position: 'topleft'});
    title.onAdd = function () {
        var div = L.DomUtil.create('div', 'map-title');
        div.innerHTML = '<h1>North Carolina Dams &amp; Flood Risk</h1>' +
            '<p>3,680 dams from the National Inventory of Dams over each county\'s FEMA inland flood risk score. Click a dam or county for details.</p>';
        return div;
    };
    title.addTo(mymap);

    // 10. Legend.
    var legend = L.control({position: 'topright'});
    legend.onAdd = function () {
        var div = L.DomUtil.create('div', 'legend');
        div.innerHTML += '<b>Inland Flood Risk Score</b><br />';
        div.innerHTML += '<i style="background: ' + colors[4] + '; opacity: 0.6"></i><p>81 - 100 (highest)</p>';
        div.innerHTML += '<i style="background: ' + colors[3] + '; opacity: 0.6"></i><p>61 - 80</p>';
        div.innerHTML += '<i style="background: ' + colors[2] + '; opacity: 0.6"></i><p>41 - 60</p>';
        div.innerHTML += '<i style="background: ' + colors[1] + '; opacity: 0.6"></i><p>21 - 40</p>';
        div.innerHTML += '<i style="background: ' + colors[0] + '; opacity: 0.6"></i><p>0 - 20 (lowest)</p>';
        div.innerHTML += '<hr><b>Dam Hazard Potential</b><br />';
        div.innerHTML += '<i class="fas fa-water marker-color-1"></i><p>High</p>';
        div.innerHTML += '<i class="fas fa-water marker-color-2"></i><p>Significant</p>';
        div.innerHTML += '<i class="fas fa-water marker-color-3"></i><p>Low</p>';
        return div;
    };
    legend.addTo(mymap);

    // 11. Scale bar.
    L.control.scale({position: 'bottomleft'}).addTo(mymap);

</script>
</body>
</html>
